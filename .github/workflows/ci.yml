name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run licenses:check
      - name: End-to-end UI smoke test (Edge)
        if: runner.os == 'Windows'
        run: npm run e2e
      - name: Accessibility audit (axe-core, WCAG 2.2 A/AA)
        if: runner.os == 'Windows'
        run: npm run a11y

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t teambot:ci .
      - name: Smoke test
        run: |
          docker run -d --name tb -p 4747:4747 teambot:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4747/healthz && exit 0; sleep 2; done
          docker logs tb; exit 1
