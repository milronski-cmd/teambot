# Codex config (fixture for the MCP import)
model = "gpt-5-codex"
approval_policy = "on-request"
notify = ["powershell", "-File", 'C:\Users\eigenaar\.codex\notify.ps1']

[mcp_servers.context7]
command = "npx"
args = [
  "-y",
  "@upstash/context7-mcp", # the server
]
startup_timeout_sec = 30

[mcp_servers.context7.env]
CONTEXT7_API_KEY = "ctx7sk-FIXTURE0000000000000000005"
LOG = 'C:\Users\eigenaar\logs'

[mcp_servers.docs]
url = "https://docs.example.com/mcp"
bearer_token_env_var = "DOCS_TOKEN"
http_headers = { "X-Team" = "winkel" }

[mcp_servers."old shell"]
command = 'C:\tools\shell-mcp.exe'
enabled = false

[[profiles]]
name = "snel"

[windows]
sandbox = "elevated"
